name: Metrics
on:
  # Atualiza a cada 24 horas
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente a action
  workflow_dispatch:
  # Atualiza sempre que você fizer um push no README
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Configurações Visuais
          user: Sxmvel
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          # Plugin de Linguagens
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_details: bytes-size, percentage
          
          # Plugin de Hábitos (Carga reduzida para evitar timeout)
          plugin_habits: yes
          plugin_habits_from: 100       # Reduzimos de 200 para 100 eventos
          plugin_habits_days: 14        # Mantém a análise das últimas 2 semanas
          plugin_habits_charts: yes
          plugin_habits_trim: yes       # Corta dados vazios para agilizar

          # Plugin de Conquistas (Limitando a busca)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8  # Limita o número de conquistas processadas
