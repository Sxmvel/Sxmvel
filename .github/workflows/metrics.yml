name: Metrics
on:
  # Atualiza a cada 24 horas
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente a action
  workflow_dispatch:
  # Atualiza sempre que você fizer um push no README
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Configurações Visuais
          user: Sxmvel
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          # Plugin de Linguagens
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_details: bytes-size, percentage
          
          # Plugin de Hábitos (Mostra em qual horário e dias da semana você mais coda)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          
          # Plugin de Linhas de Código
          plugin_lines: yes
          
          # Plugin de Conquistas (Achievements)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
